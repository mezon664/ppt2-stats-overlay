<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PPT2 Stats Overlay (OBS)</title>
<style>
  /* Size this browser source to cover the game capture exactly (16:9).
     Same layout, styles and settings as the desktop HUD (hud/overlay.py): the
     server sends the "display" settings with every update, so changes made in
     the HUD's settings window (or config/overlay_settings.json) apply here too.
     --u = one reference px (1232-wide game) x display.scale, set by script
     (not rem: a ~1px root font size would be raised by browser minimums). */
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    color: #fff;
    overflow: hidden;
  }
  :root {
    --u: 1px; --band: rgba(12,22,60,0.85); --clear: rgba(12,22,60,0);
    /* display.text_weight, set by script (TEXT_WEIGHTS). The fonts stop at Bold,
       so past that text is thickened with a stroke in its own color. */
    --fw-bold: 700; --fw-semi: 700; --fw-stroke: 0.05;
    --p-left: rgb(59,142,234); --p-right: rgb(229,72,77);
    --t-left: rgb(140,200,255); --t-right: rgb(255,154,158);
  }
  * { -webkit-text-stroke: calc(var(--fw-stroke) * 1em) currentColor; }
  /* display.text_outline: black outline around ALL text (0.10 x font size, as
     the HUD). Black, since navy vanished on the band/clock/summary boxes;
     !important so the "text" style's own navy outlines give way to it too. */
  body.outlined * {
    text-shadow: 0.1em 0 0 #000, -0.1em 0 0 #000, 0 0.1em 0 #000, 0 -0.1em 0 #000,
      0.071em 0.071em 0 #000, -0.071em 0.071em 0 #000, 0.071em -0.071em 0 #000, -0.071em -0.071em 0 #000 !important;
  }
  .abs { position: absolute; }
  .num { font-variant-numeric: tabular-nums; }
  .state:empty, .status:empty, .hidden { display: none !important; }

  /* --- per-player stat blocks; .hug-r = placed left of the board, so the
     content hugs the block's right edge (the board side) --- */
  .stat { box-sizing: border-box; }
  .stat .row { display: flex; align-items: baseline; gap: calc(4 * var(--u)); }
  .stat.hug-r .row { justify-content: flex-end; }
  .lab { font-weight: var(--fw-bold); }
  /* Room for the widest value (APM 888.8, PPS/APP 8.88) so labels don't shift
     as numbers change — same idea as hud/overlay.py VALUE_TEMPLATES. */
  .stat:not(.st-gauge) .val { display: inline-block; }
  .stat:not(.st-gauge) .val.v-apm { min-width: 5ch; }
  .stat:not(.st-gauge) .val.v-pps, .stat:not(.st-gauge) .val.v-app { min-width: 4ch; }
  .stat.hug-r .val, .st-pop .val { text-align: right; }

  .st-band { min-width: calc(92 * var(--u)); padding: calc(3 * var(--u)) calc(5 * var(--u)); }
  .st-band .row { height: calc(21 * var(--u)); }
  .st-band .lab { font-size: calc(12 * var(--u)); }
  .st-band .val { font-size: calc(17 * var(--u)); font-weight: var(--fw-semi); }
  .st-band.hug-r, .st-gauge.hug-r { background: linear-gradient(to right, var(--clear) 0%, var(--band) 55%, var(--band) 100%); }
  .st-band.hug-l, .st-gauge.hug-l { background: linear-gradient(to right, var(--band) 0%, var(--band) 45%, var(--clear) 100%); }

  .st-pop { min-width: calc(104 * var(--u)); padding: calc(1 * var(--u)) 0; }
  .st-pop .row { height: calc(26 * var(--u)); align-items: center; }
  .st-pop .pill {
    display: inline-flex; align-items: baseline; gap: calc(5 * var(--u));
    height: calc(22 * var(--u)); line-height: calc(22 * var(--u)); box-sizing: border-box;
    padding: 0 calc(11 * var(--u)); border-radius: 999px;
    border: calc(2.5 * var(--u)) solid #fff; margin: 0 calc(2 * var(--u));
  }
  .st-pop.p-left .pill { background: var(--p-left); }
  .st-pop.p-right .pill { background: var(--p-right); }
  .st-pop .lab { font-size: calc(11 * var(--u)); color: rgb(225,236,255); }
  .st-pop .val { font-size: calc(16 * var(--u)); font-weight: var(--fw-bold); }

  .st-gauge { min-width: calc(104 * var(--u)); padding: calc(3 * var(--u)) calc(6 * var(--u)); }
  .st-gauge .row { height: calc(27 * var(--u)); flex-wrap: wrap; justify-content: space-between !important; align-content: flex-start; }
  .st-gauge .lab { font-size: calc(11 * var(--u)); color: rgb(220,228,245); }
  /* label + value in the 80 nearest the board (lines up with the band style's
     text), the bar keeps the full 104 — hud/overlay.py GAUGE_TEXT_W */
  .st-gauge.hug-r .lab { margin-left: calc(24 * var(--u)); }
  .st-gauge.hug-l .val { margin-right: calc(24 * var(--u)); }
  .st-gauge .val { font-size: calc(15 * var(--u)); font-weight: var(--fw-semi); }
  .st-gauge .bar { flex-basis: 100%; height: calc(4.5 * var(--u)); border-radius: 999px;
    background: rgba(255,255,255,0.24); display: flex; overflow: hidden; margin-top: calc(1 * var(--u)); }
  .st-gauge.hug-r .bar { justify-content: flex-end; }   /* grows from the board side */
  .st-gauge .bar i { display: block; height: 100%; border-radius: 999px; }
  .st-gauge.p-left .bar i { background: var(--p-left); }
  .st-gauge.p-right .bar i { background: var(--p-right); }

  .st-text { min-width: calc(104 * var(--u)); padding: calc(1 * var(--u)) calc(5 * var(--u)); }
  .st-text .row { height: calc(23 * var(--u)); }
  .st-text .lab { font-size: calc(12 * var(--u)); }
  .st-text .val { font-size: calc(20 * var(--u)); font-weight: var(--fw-semi); }
  .st-text .lab, .st-text .val {
    text-shadow:
      calc(-1.6 * var(--u)) calc(-1.6 * var(--u)) 0 #1b2440, calc(1.6 * var(--u)) calc(-1.6 * var(--u)) 0 #1b2440,
      calc(-1.6 * var(--u)) calc(1.6 * var(--u)) 0 #1b2440, calc(1.6 * var(--u)) calc(1.6 * var(--u)) 0 #1b2440,
      0 calc(-1.6 * var(--u)) 0 #1b2440, 0 calc(1.6 * var(--u)) 0 #1b2440,
      calc(-1.6 * var(--u)) 0 0 #1b2440, calc(1.6 * var(--u)) 0 0 #1b2440;
  }

  /* --- opener (開幕テンプレ), display.opener_display: om-board (A, a few
     seconds over the board), om-hold (B), om-namebar (C), om-top (D) --- */
  .ob { box-sizing: border-box; white-space: nowrap; font-weight: var(--fw-bold); color: #fff;
    background: rgba(12,22,60,max(0.78, var(--band-a))); border-radius: calc(6 * var(--u)); }
  #ob-left { --acc: var(--p-left); --lab: var(--t-left); }
  #ob-right { --acc: var(--p-right); --lab: var(--t-right); }
  .ob .olab { color: var(--lab, rgb(220,228,245)); }
  .ob:not(#ob-both) { box-shadow: inset 0 calc(-3 * var(--u)) 0 var(--acc); }
  body.om-board .ob { padding: calc(4 * var(--u)) calc(22 * var(--u)) calc(8 * var(--u)); border-radius: calc(10 * var(--u)); text-align: center; }
  body.om-board .olab { font-size: calc(13 * var(--u)); line-height: calc(22 * var(--u)); }
  body.om-board .oname { font-size: calc(28 * var(--u)); line-height: calc(36 * var(--u)); }
  body.om-hold .ob { padding: calc(3 * var(--u)) calc(12 * var(--u)) calc(6 * var(--u)); }
  body.om-hold .olab { font-size: calc(10 * var(--u)); line-height: calc(14 * var(--u)); }
  body.om-hold .oname { font-size: calc(15 * var(--u)); line-height: calc(20 * var(--u)); }
  body.om-namebar .ob { height: calc(20 * var(--u)); line-height: calc(17 * var(--u)); padding: 0 calc(10 * var(--u));
    font-size: calc(12 * var(--u)); border-radius: 999px; box-shadow: none; border: calc(2 * var(--u)) solid var(--acc); }
  #ob-both { padding: calc(4 * var(--u)) calc(14 * var(--u)) calc(8 * var(--u)); min-width: calc(200 * var(--u));
    background: linear-gradient(to right, var(--p-left) 50%, var(--p-right) 50%) bottom / 100% calc(3 * var(--u)) no-repeat,
                rgba(12,22,60,max(0.78, var(--band-a))); }
  #ob-both .olab { text-align: center; font-size: calc(11 * var(--u)); line-height: calc(16 * var(--u)); }
  #ob-both .orow { display: flex; align-items: baseline; justify-content: space-between; gap: calc(10 * var(--u)); font-size: calc(18 * var(--u)); }
  #ob-both .ol { color: var(--t-left); } #ob-both .or { color: var(--t-right); }
  #ob-both .ovs { font-size: calc(13 * var(--u)); color: rgb(220,228,245); }
  body.style-gauge .ob { border-radius: 0 !important; }
  body.style-pop .ob:not(#ob-both) { background: var(--acc); box-shadow: none; border: calc(2.5 * var(--u)) solid #fff; border-radius: calc(14 * var(--u)); }
  body.style-pop .ob .olab { color: rgb(235,242,255); }
  body.style-text .ob { background: none !important; box-shadow: none; border-color: transparent; }
  body.style-text .ob div, body.style-text .ob span {
    text-shadow: calc(-1.6 * var(--u)) 0 0 #1b2440, calc(1.6 * var(--u)) 0 0 #1b2440,
      0 calc(-1.6 * var(--u)) 0 #1b2440, 0 calc(1.6 * var(--u)) 0 #1b2440; }
  .summary .sop { font-size: calc(12 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --- versus: one block between the boards --- */
  .versus { width: calc(150 * var(--u)); box-sizing: border-box; padding: calc(3 * var(--u)) calc(7 * var(--u));
    background: var(--band); border-radius: calc(4 * var(--u)); }
  .versus .vrow { height: calc(34 * var(--u)); position: relative; }
  .versus .vlab { position: absolute; left: 0; right: 0; top: calc(1 * var(--u)); text-align: center;
    font-size: calc(10 * var(--u)); font-weight: var(--fw-bold); color: rgb(220,228,245); }
  .versus .vals { display: flex; justify-content: space-between; font-size: calc(15 * var(--u)); font-weight: var(--fw-bold);
    line-height: calc(19 * var(--u)); }
  .versus .l { color: var(--t-left); } .versus .r { color: var(--t-right); }
  .versus .split { display: flex; height: calc(6 * var(--u)); border-radius: calc(3 * var(--u)); overflow: hidden;
    background: rgba(255,255,255,0.24); margin-top: calc(1 * var(--u)); }
  .versus .split .a { background: var(--p-left); } .versus .split .b { background: var(--p-right); }

  /* --- events and clock: follow the chosen style (body.style-*) like the
     stats do — same looks as the HUD's EventBlock / ClockBlock --- */
  .events {
    padding: calc(2 * var(--u)) calc(6 * var(--u)) calc(2 * var(--u)) calc(11 * var(--u));
    font-size: calc(10 * var(--u)); font-weight: var(--fw-semi); color: #e4e4e7;
    line-height: calc(14 * var(--u));
    text-align: right; white-space: nowrap; box-sizing: border-box;
    background: linear-gradient(to right, var(--clear) 0%, var(--band) 45%, var(--band) 100%);
  }
  body.pos-right .events {
    padding: calc(2 * var(--u)) calc(11 * var(--u)) calc(2 * var(--u)) calc(6 * var(--u));
    text-align: left;
    background: linear-gradient(to right, var(--band) 0%, var(--band) 55%, var(--clear) 100%);
  }
  body.style-gauge .events.p-left { box-shadow: inset calc(-2 * var(--u)) 0 0 var(--p-left); }
  body.style-gauge .events.p-right { box-shadow: inset calc(-2 * var(--u)) 0 0 var(--p-right); }
  body.style-gauge.pos-right .events.p-left { box-shadow: inset calc(2 * var(--u)) 0 0 var(--p-left); }
  body.style-gauge.pos-right .events.p-right { box-shadow: inset calc(2 * var(--u)) 0 0 var(--p-right); }
  body.style-text .events { background: none; color: #fff; line-height: calc(15 * var(--u)); }
  body.style-pop .events { background: none; display: flex; flex-direction: column; align-items: flex-end;
    gap: calc(3 * var(--u)); padding: calc(2 * var(--u)); line-height: normal; }
  body.style-pop.pos-right .events { align-items: flex-start; }
  body.style-pop .events div { height: calc(16 * var(--u)); line-height: calc(13 * var(--u)); box-sizing: border-box;
    padding: 0 calc(7 * var(--u)); border-radius: 999px; border: calc(1.5 * var(--u)) solid #fff; color: #fff; }
  body.style-pop .events.p-left div { background: var(--p-left); }
  body.style-pop .events.p-right div { background: var(--p-right); }

  .clockbox {
    padding: calc(2 * var(--u)) calc(8 * var(--u));
    background: var(--band);
    border-radius: calc(4 * var(--u));
    text-align: center;
  }
  body.style-gauge .clockbox { border-radius: 0; padding-bottom: calc(5 * var(--u));
    background: linear-gradient(to right, var(--p-left) 50%, var(--p-right) 50%) bottom / 100% calc(2.5 * var(--u)) no-repeat, var(--band); }
  body.style-pop .clockbox { background: rgb(30,42,85); border: calc(2.5 * var(--u)) solid #fff;
    border-radius: calc(12 * var(--u)); padding: calc(2 * var(--u)) calc(12 * var(--u)); }
  body.style-text .clockbox { background: none; padding: 0 calc(4 * var(--u)); }
  .clock { font-size: calc(18 * var(--u)); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
  .state { font-size: calc(10 * var(--u)); font-weight: var(--fw-semi); color: #fde68a; }
  .status { font-size: calc(10 * var(--u)); font-weight: var(--fw-semi); color: #fca5a5; }
  body.style-text .clockbox div, body.style-text .events {
    text-shadow:
      calc(-1.3 * var(--u)) calc(-1.3 * var(--u)) 0 #1b2440, calc(1.3 * var(--u)) calc(-1.3 * var(--u)) 0 #1b2440,
      calc(-1.3 * var(--u)) calc(1.3 * var(--u)) 0 #1b2440, calc(1.3 * var(--u)) calc(1.3 * var(--u)) 0 #1b2440,
      0 calc(-1.3 * var(--u)) 0 #1b2440, 0 calc(1.3 * var(--u)) 0 #1b2440,
      calc(-1.3 * var(--u)) 0 0 #1b2440, calc(1.3 * var(--u)) 0 0 #1b2440;
  }
  /* --- end-of-match summary (same looks as the HUD's SummaryBlock) --- */
  .summary { width: calc(212 * var(--u)); box-sizing: border-box; padding: calc(4 * var(--u)) calc(12 * var(--u)) calc(6 * var(--u));
    background: rgba(12,22,60,max(0.5, var(--band-a))); border-radius: calc(6 * var(--u)); }
  .summary .stitle { text-align: center; font-size: calc(15 * var(--u)); font-weight: var(--fw-bold); line-height: calc(28 * var(--u)); }
  /* 1P | label | 2P, each centered in its column; the player columns are
     centered at 20% / 80% of the box like hud/overlay.py SummaryBlock.COL_X
     (60.8 = 2 x (0.2 x 212 - 12 padding)) */
  .summary .srow { display: grid; grid-template-columns: calc(60.8 * var(--u)) 1fr calc(60.8 * var(--u));
    align-items: baseline; height: calc(20 * var(--u)); }
  .summary .slab { font-size: calc(12 * var(--u)); font-weight: var(--fw-semi); color: rgb(220,228,245); text-align: center; }
  .summary .sl, .summary .sr { font-size: calc(15 * var(--u)); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums;
    text-align: center; min-width: 0; }
  .summary .sl { color: var(--t-left); } .summary .sr { color: var(--t-right); }
  body.style-gauge .summary { border-radius: 0;
    background: linear-gradient(to right, var(--p-left) 50%, var(--p-right) 50%) top / 100% calc(2.5 * var(--u)) no-repeat, rgba(12,22,60,max(0.5, var(--band-a))); }
  body.style-pop .summary { background: rgb(30,42,85); border: calc(2.5 * var(--u)) solid #fff; border-radius: calc(12 * var(--u)); }
  body.style-text .summary { background: none; }
  body.style-text .summary div, body.style-text .summary span {
    text-shadow: calc(-1.3 * var(--u)) 0 0 #1b2440, calc(1.3 * var(--u)) 0 0 #1b2440,
      0 calc(-1.3 * var(--u)) 0 #1b2440, 0 calc(1.3 * var(--u)) 0 #1b2440; }

  /* Capture down: dim instead of hiding — the numbers are the last real
     measurement, never fabricated, but not live either. */
  body.stale .abs { opacity: 0.4; }
</style>
</head>
<body>
  <div class="abs clockbox" id="clockbox">
    <div class="clock" id="clock">0:00</div>
    <div class="state" id="state"></div>
    <div class="status" id="status">接続中...</div>
  </div>
  <div class="abs events p-left hidden" id="ev-left"></div>
  <div class="abs events p-right hidden" id="ev-right"></div>
  <div class="abs stat" id="stat-left"></div>
  <div class="abs stat" id="stat-right"></div>
  <div class="abs versus hidden" id="versus"></div>
  <div class="abs summary hidden" id="summary"></div>
  <div class="abs ob hidden" id="ob-left"></div>
  <div class="abs ob hidden" id="ob-right"></div>
  <div class="abs ob hidden" id="ob-both"></div>

<script>
// Layout in reference px (1232x692 game client) — same numbers as hud/overlay.py.
const REF_W = 1232;
const STAT_ANCHOR_X = { left: { left: 186, right: 790 }, right: { left: 448, right: 1052 } };
const STAT_BOTTOM_Y = 562, EVENT_GAP = 2, VERSUS_GAP = 4;
const CLOCK_CENTER_X = 617, CLOCK_BOTTOM_Y = 576;
const SUMMARY_TOP_Y = 120;
// opener displays (same numbers as hud/overlay.py)
const POPUP_S = 4.0, POPUP_FADE_S = 1.0;
const BOARD_CENTER_X = { left: 313, right: 918 }, OPENER_BOARD_TOP_Y = 150;
const HOLD_RIGHT_X = { left: 191, right: 797 }, OPENER_HOLD_TOP_Y = 172;
const NAMEBAR_RIGHT_X = 466, NAMEBAR_LEFT_X = 762, NAMEBAR_TOP_Y = 608;
const OPENER_TOP_CENTER_X = 617, OPENER_TOP_Y = 14;
const OPENER_DISPLAYS = ["board", "hold", "namebar", "top"];
const SUMMARY_ROWS = [   // [key, label, decimals; null = text]
  ["opener", "s_opener", null], ["apm", "s_apm", 1], ["pps", "s_pps", 2], ["app", "s_app", 2], ["lines_sent", "s_lines", 0],
  ["pieces", "s_pieces", 0], ["max_ren", "s_max_ren", 0], ["tetris", "s_tetris", 0],
  ["tspin", "s_tspin", 0], ["perfect_clear", "s_pc", 0]];
const GAUGE_MAX = { apm: 120, pps: 4, app: 1 };   // value that fills a gauge bar
const STYLES = ["band", "pop", "gauge", "text", "versus"];
// display.text_weight -> [bold, semi, stroke x font size] (same as hud/overlay.py TEXT_WEIGHT_PRESETS)
const TEXT_WEIGHTS = { normal: [700, 600, 0], bold: [700, 700, 0.05] };
// The overlay's own text, by display.language (event text comes from the
// server in both languages: "text" / "text_en").
const UI_TEXT = {
  ja: { frozen: "試合終了", paused: "試合中断中", waiting: "スタート待ち", down: "認識不可",
        summary: "試合結果", s_opener: "開幕", s_apm: "APM", s_pps: "PPS", s_app: "APP", s_lines: "送った段数",
        s_pieces: "置いたミノ", s_max_ren: "最大REN", s_tetris: "TETRIS", s_tspin: "T-SPIN", s_pc: "パーフェクト",
        connecting: "接続中...", disconnected: "切断されました。再接続中..." },
  en: { frozen: "Match over", paused: "Paused", waiting: "Waiting for start", down: "Can't read the game",
        summary: "Match summary", s_opener: "Opener", s_apm: "APM", s_pps: "PPS", s_app: "APP", s_lines: "Lines sent",
        s_pieces: "Pieces", s_max_ren: "Max REN", s_tetris: "TETRIS", s_tspin: "T-SPIN", s_pc: "Perfect clear",
        connecting: "Connecting...", disconnected: "Disconnected. Reconnecting..." },
};
const ui = () => UI_TEXT[display.language === "en" ? "en" : "ja"];
const DEFAULTS = { style: "band", text_weight: "bold", text_outline: true, language: "ja", stats_position: "left", scale: 1.0, offset_x: 0, offset_y: 0,
  clock_offset_x: 0, clock_offset_y: 0, event_offset_x: 0, event_offset_y: 0,
  summary_offset_x: 0, summary_offset_y: 0, show_summary: true, show_opener: true, opener_display: "board",
  background_opacity: 0.85, show_apm: true, show_pps: true, show_app: true, show_clock: true,
  show_event_log: false, event_log_count: 3 };

let display = { ...DEFAULTS };
let lastState = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (key, v) => v == null ? "--" : Number(v).toFixed(key === "apm" ? 1 : 2);
const shownKeys = () => ["apm", "pps", "app"].filter((k) => display["show_" + k]);
const style = () => STYLES.includes(display.style) ? display.style : "band";

// PPS = pieces placed / match seconds; APM = lines sent / match minutes (the
// user's own definition). Both use match time, so pauses don't count.
function values(data) {
  data = data || {};
  return { apm: (data.apm || {}).apm, pps: data.pps, app: data.app, opener: data.opener };
}

function statRowsHtml(st, side, v) {
  return shownKeys().map((key) => {
    const lab = `<span class="lab">${key.toUpperCase()}</span>`;
    const val = `<span class="val num v-${key}">${fmt(key, v[key])}</span>`;
    if (st === "pop") return `<div class="row"><span class="pill">${lab}${val}</span></div>`;
    if (st === "gauge") {
      const frac = v[key] == null ? 0 : Math.max(0, Math.min(1, v[key] / GAUGE_MAX[key]));
      return `<div class="row">${lab}${val}<div class="bar"><i style="width:${(frac * 100).toFixed(1)}%"></i></div></div>`;
    }
    return `<div class="row">${lab}${val}</div>`;
  }).join("");
}

function versusHtml(left, right) {
  return shownKeys().map((key) => {
    const a = left[key] || 0, b = right[key] || 0, total = a + b;
    const split = total > 0
      ? `<div class="a" style="width:${(a / total * 100).toFixed(1)}%"></div><div class="b" style="flex:1"></div>`
      : "";
    return `<div class="vrow"><div class="vlab">${key.toUpperCase()}</div>` +
      `<div class="vals"><span class="l num">${fmt(key, left[key])}</span><span class="r num">${fmt(key, right[key])}</span></div>` +
      `<div class="split">${split}</div></div>`;
  }).join("");
}

function summaryHtml(state) {
  const side = (data) => ({ ...values(data), ...((data || {}).match_stats || {}) });
  const L = side(state.left), R = side(state.right);
  const f = (v, dec) => v == null ? "--" : Number(v).toFixed(dec);
  const s = Math.max(0, Math.floor(state.match_elapsed_s || 0));
  const time = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const cell = (cls, v, dec) => dec === null
    ? `<span class="${cls} sop">${esc(v || "--")}</span>` : `<span class="${cls}">${f(v, dec)}</span>`;
  return `<div class="stitle">${ui().summary}&nbsp;&nbsp;${time}</div>` + SUMMARY_ROWS.map(([key, lab, dec]) =>
    `<div class="srow">${cell("sl", L[key], dec)}<span class="slab">${ui()[lab]}</span>` +
    `${cell("sr", R[key], dec)}</div>`).join("");
}

function layout() {
  const k = window.innerWidth / REF_W;          // screen px per reference px
  const d = display, st = style();
  document.documentElement.style.setProperty("--u", (k * d.scale) + "px");
  document.documentElement.style.setProperty("--band", `rgba(12,22,60,${d.background_opacity})`);
  document.documentElement.style.setProperty("--band-a", d.background_opacity);
  const [fwBold, fwSemi, fwStroke] = TEXT_WEIGHTS[d.text_weight] || TEXT_WEIGHTS.bold;
  document.body.classList.toggle("outlined", !!d.text_outline);
  document.documentElement.style.setProperty("--fw-bold", fwBold);
  document.documentElement.style.setProperty("--fw-semi", fwSemi);
  document.documentElement.style.setProperty("--fw-stroke", fwStroke);
  const mode = d.stats_position === "right" ? "right" : "left";
  document.body.classList.toggle("pos-right", mode === "right");
  for (const s of STYLES) document.body.classList.toggle("style-" + s, s === st);
  const anyStat = shownKeys().length > 0;
  const showStat = anyStat && st !== "versus";

  for (const side of ["left", "right"]) {
    const stat = $("stat-" + side), ev = $("ev-" + side);
    stat.className = `abs stat st-${st} p-${side} ${mode === "left" ? "hug-r" : "hug-l"}` + (showStat ? "" : " hidden");
    const x = (STAT_ANCHOR_X[mode][side] + d.offset_x) * k;
    const ex = x + d.event_offset_x * k;    // events: stacked above the stats, then their own offset
    let bottom = (STAT_BOTTOM_Y + d.offset_y) * k;
    for (const [el, ax] of [[stat, x], [ev, ex]]) {
      el.style.left = mode === "left" ? "auto" : ax + "px";
      el.style.right = mode === "left" ? (window.innerWidth - ax) + "px" : "auto";
    }
    if (showStat) {
      stat.style.top = (bottom - stat.offsetHeight) + "px";
      bottom -= stat.offsetHeight + EVENT_GAP * k * d.scale;
    }
    ev.style.top = (bottom + d.event_offset_y * k - ev.offsetHeight) + "px";
  }
  const cb = $("clockbox");
  cb.classList.toggle("hidden", !d.show_clock);
  const clockTop = CLOCK_BOTTOM_Y * k - cb.offsetHeight;   // default spot (the versus block uses it)
  cb.style.left = ((CLOCK_CENTER_X + d.clock_offset_x) * k - cb.offsetWidth / 2) + "px";
  cb.style.top = (clockTop + d.clock_offset_y * k) + "px";

  // versus: centered between the boards, just above the clock; offsets move it too.
  const vs = $("versus");
  vs.classList.toggle("hidden", !(anyStat && st === "versus"));
  const vb = d.show_clock ? clockTop - VERSUS_GAP * k * d.scale : CLOCK_BOTTOM_Y * k;
  vs.style.left = ((CLOCK_CENTER_X + d.offset_x) * k - vs.offsetWidth / 2) + "px";
  vs.style.top = (vb + d.offset_y * k - vs.offsetHeight) + "px";

  // opener (開幕テンプレ): where display.opener_display says
  const om = OPENER_DISPLAYS.includes(d.opener_display) ? d.opener_display : "board";
  for (const m of OPENER_DISPLAYS) document.body.classList.toggle("om-" + m, m === om);
  const st0 = lastState || {};
  const names = { left: (st0.left || {}).opener, right: (st0.right || {}).opener };
  for (const id of ["ob-left", "ob-right", "ob-both"]) $(id).classList.add("hidden");
  if (d.show_opener && om === "top" && (names.left || names.right)) {
    const ob = $("ob-both");
    ob.classList.remove("hidden");
    ob.style.opacity = 1;
    ob.style.left = (OPENER_TOP_CENTER_X * k - ob.offsetWidth / 2) + "px";
    ob.style.top = (OPENER_TOP_Y * k) + "px";
  } else if (d.show_opener && om !== "top") {
    for (const side of ["left", "right"]) {
      if (!names[side]) continue;
      let alpha = 1;
      if (om === "board") {
        const age = (st0[side] || {}).opener_age_s;
        if (age == null || age >= POPUP_S || st0.frozen) continue;
        alpha = Math.min(1, (POPUP_S - age) / POPUP_FADE_S);
      }
      const ob = $("ob-" + side);
      ob.classList.remove("hidden");
      ob.style.opacity = alpha;
      let x, y;
      if (om === "board") { x = BOARD_CENTER_X[side] * k - ob.offsetWidth / 2; y = OPENER_BOARD_TOP_Y * k; }
      else if (om === "hold") { x = HOLD_RIGHT_X[side] * k - ob.offsetWidth; y = OPENER_HOLD_TOP_Y * k; }
      else { x = side === "left" ? NAMEBAR_RIGHT_X * k - ob.offsetWidth : NAMEBAR_LEFT_X * k; y = NAMEBAR_TOP_Y * k; }
      ob.style.left = x + "px";
      ob.style.top = y + "px";
    }
  }

  // summary: while a finished match is on screen
  const sm = $("summary");
  const ready = lastState && lastState.frozen && (lastState.match_elapsed_s || 0) > 0;
  sm.classList.toggle("hidden", !(d.show_summary && ready));
  sm.style.left = ((CLOCK_CENTER_X + d.summary_offset_x) * k - sm.offsetWidth / 2) + "px";
  sm.style.top = ((SUMMARY_TOP_Y + d.summary_offset_y) * k) + "px";
}

function renderSide(side, data) {
  $("stat-" + side).innerHTML = statRowsHtml(style(), side, values(data));
  const ev = $("ev-" + side);
  const log = ((data || {}).event_log || []).slice(0, display.event_log_count).reverse();  // oldest on top
  const key = display.language === "en" ? "text_en" : "text";
  ev.innerHTML = log.map((e) => `<div>${esc(e[key] || e.text || "")}</div>`).join("");
  ev.classList.toggle("hidden", !(display.show_event_log && log.length));
}

function render(state) {
  if (state.display) display = { ...DEFAULTS, ...state.display };
  renderSide("left", state.left);
  renderSide("right", state.right);
  $("versus").innerHTML = versusHtml(values(state.left), values(state.right));
  $("summary").innerHTML = summaryHtml(state);
  const lab = ui().s_opener, sep = display.language === "en" ? ": " : "：";
  for (const side of ["left", "right"]) {
    const name = esc(((state[side] || {}).opener) || "");
    $("ob-" + side).innerHTML = display.opener_display === "namebar"
      ? `<span class="olab">${lab}${sep}</span><span class="oname">${name}</span>`
      : `<div class="olab">${lab}</div><div class="oname">${name}</div>`;
  }
  $("ob-both").innerHTML = `<div class="olab">${lab}</div><div class="orow">` +
    `<span class="ol">${esc((state.left || {}).opener || "--")}</span><span class="ovs">vs</span>` +
    `<span class="or">${esc((state.right || {}).opener || "--")}</span></div>`;
  // Match clock is game time: it stops while paused and resumes after.
  const s = Math.max(0, Math.floor(state.match_elapsed_s || 0));
  $("clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("state").textContent = state.frozen ? ui().frozen
    : state.paused ? ui().paused
    : state.waiting_start ? ui().waiting : "";
  const captureDown = state.capture && state.capture.ok === false;
  document.body.classList.toggle("stale", !!captureDown);
  const msg = (display.language === "en" && state.capture && state.capture.message_en) || (state.capture || {}).message;
  $("status").textContent = captureDown ? ui().down + ": " + msg : "";
  layout();
}

function connect() {
  const ws = new WebSocket("ws://127.0.0.1:8765");
  ws.onopen = () => { $("status").textContent = ""; layout(); };
  ws.onclose = () => {
    $("status").textContent = ui().disconnected;
    layout();
    setTimeout(connect, 2000);
  };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (event) => { lastState = JSON.parse(event.data); render(lastState); };
}
window.addEventListener("resize", layout);
render({});
connect();
</script>
</body>
</html>
