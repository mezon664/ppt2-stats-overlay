<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PPTetrics (OBS)</title>
<style>
  /* Size this browser source to cover the game capture exactly (16:9).
     Same layout, styles and settings as the desktop HUD (hud/overlay.py): the
     server sends the "display" settings with every update, so changes made in
     the HUD's settings window (or config/overlay_settings.json) apply here too.
     --u = one reference px (1232-wide game) x display.scale, set by script
     (not rem: a ~1px root font size would be raised by browser minimums). */
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    color: var(--fg);
    overflow: hidden;
  }
  :root {
    /* display.bg_color / text_color and the colors made from them (setColors(),
       same as hud/overlay.py set_colors); these are the defaults */
    --bg-rgb: 0,0,0; --fg: #fff; --soft-rgb: 226,226,232; --event-rgb: 230,231,236;
    --pop-rgb: 31,40,76; --outline-rgb: 27,36,72; --to: #000;
    --u: 1px; --band: rgba(var(--bg-rgb),0.85); --clear: rgba(var(--bg-rgb),0);
    /* display.text_weight, set by script (weightStyle). The fonts stop at Bold,
       so past that text is thickened with a stroke in its own color. */
    --fw-bold: 700; --fw-semi: 700; --fw-stroke: 0.05;
    --p-left: rgb(59,142,234); --p-right: rgb(229,72,77);
    --t-left: rgb(140,200,255); --t-right: rgb(255,154,158);
  }
  * { -webkit-text-stroke: calc(var(--fw-stroke) * 1em) currentColor; }
  /* display.text_outline: black outline around ALL text (0.10 x font size, as
     the HUD). Black, since navy vanished on the band/clock/summary boxes;
     !important so the "text" style's own navy outlines give way to it too. */
  body.outlined * {
    text-shadow: 0.1em 0 0 var(--to), -0.1em 0 0 var(--to), 0 0.1em 0 var(--to), 0 -0.1em 0 var(--to),
      0.071em 0.071em 0 var(--to), -0.071em 0.071em 0 var(--to), 0.071em -0.071em 0 var(--to), -0.071em -0.071em 0 var(--to) !important;
  }
  .abs { position: absolute; }
  /* each part takes its own text color (display.parts), not the page's */
  .stat, .events, .clockbox, .summary, .ob, .versus { color: var(--fg); }
  .num { font-variant-numeric: tabular-nums; }
  .state:empty, .status:empty, .hidden { display: none !important; }

  /* --- per-player stat blocks; .hug-r = placed left of the board, so the
     content hugs the block's right edge (the board side) --- */
  .stat { box-sizing: border-box; }
  .stat .row { display: flex; align-items: baseline; gap: calc(4 * var(--u)); }
  .stat.hug-r .row { justify-content: flex-end; }
  .lab { font-weight: var(--fw-bold); }
  /* Room for the widest value (APM 888.8, PPS/APP 8.88) so labels don't shift
     as numbers change — same idea as hud/overlay.py VALUE_TEMPLATES. */
  .stat:not(.st-gauge) .val { display: inline-block; }
  /* One value width for every row (the widest shown: APM's when it's on) and
     labels sized to the widest label by alignStatColumns(), so APM / PPS / APP
     line up as a table — labels start in one column, values end in one. */
  .stat:not(.st-gauge) .val { min-width: var(--slot, 4ch); text-align: right; }
  .stat:not(.st-gauge) .lab { display: inline-block; text-align: left; }

  .st-band { min-width: calc(92 * var(--u)); padding: calc(3 * var(--u)) calc(5 * var(--u)); }
  .st-band .row { height: calc(21 * var(--u)); }
  .st-band .lab { font-size: calc(12 * var(--u)); }
  .st-band .val { font-size: calc(17 * var(--u)); font-weight: var(--fw-semi); }
  .st-band.hug-r, .st-gauge.hug-r { background: linear-gradient(to right, var(--clear) 0%, var(--band) 55%, var(--band) 100%); }
  .st-band.hug-l, .st-gauge.hug-l { background: linear-gradient(to right, var(--band) 0%, var(--band) 45%, var(--clear) 100%); }

  .st-pop { min-width: calc(104 * var(--u)); padding: calc(1 * var(--u)) 0; }
  .st-pop .row { height: calc(26 * var(--u)); align-items: center; }
  .st-pop .pill {
    display: inline-flex; align-items: baseline; gap: calc(5 * var(--u));
    height: calc(22 * var(--u)); line-height: calc(22 * var(--u)); box-sizing: border-box;
    padding: 0 calc(11 * var(--u)); border-radius: 999px;
    border: calc(2.5 * var(--u)) solid #fff; margin: 0 calc(2 * var(--u));
  }
  .st-pop.p-left .pill { background: var(--p-left); }
  .st-pop.p-right .pill { background: var(--p-right); }
  .st-pop .lab { font-size: calc(11 * var(--u)); color: rgb(225,236,255); }
  .st-pop .val { font-size: calc(16 * var(--u)); font-weight: var(--fw-bold); }

  .st-gauge { min-width: calc(104 * var(--u)); padding: calc(3 * var(--u)) calc(6 * var(--u)); }
  .st-gauge .row { height: calc(27 * var(--u)); flex-wrap: wrap; justify-content: space-between !important; align-content: flex-start; }
  .st-gauge .lab { font-size: calc(11 * var(--u)); color: rgb(var(--soft-rgb)); }
  /* label + value in the 86 nearest the board (about where the band style's
     text starts), the bar keeps the full 104 — hud/overlay.py GAUGE_TEXT_W */
  .st-gauge.hug-r .lab { margin-left: calc(18 * var(--u)); }
  .st-gauge.hug-l .val { margin-right: calc(18 * var(--u)); }
  .st-gauge .val { font-size: calc(15 * var(--u)); font-weight: var(--fw-semi); }
  .st-gauge .bar { flex-basis: 100%; height: calc(4.5 * var(--u)); border-radius: 999px;
    background: rgba(255,255,255,0.24); display: flex; overflow: hidden; margin-top: calc(1 * var(--u)); }
  .st-gauge.hug-r .bar { justify-content: flex-end; }   /* grows from the board side */
  .st-gauge .bar i { display: block; height: 100%; border-radius: 999px; }
  .st-gauge.p-left .bar i { background: var(--p-left); }
  .st-gauge.p-right .bar i { background: var(--p-right); }

  /* "simple": plain square boxes in one color */
  .st-simple { min-width: calc(92 * var(--u)); padding: calc(3 * var(--u)) calc(5 * var(--u)); background: var(--band); }
  .st-simple .row { height: calc(21 * var(--u)); }
  .st-simple .lab { font-size: calc(12 * var(--u)); }
  .st-simple .val { font-size: calc(17 * var(--u)); font-weight: var(--fw-semi); }
  body.style-simple .events, body.style-simple .clockbox, body.style-simple .summary, body.style-simple .ob {
    background: var(--band) !important; border-radius: 0 !important; border: none !important; box-shadow: none !important; }

  .st-text { min-width: calc(104 * var(--u)); padding: calc(1 * var(--u)) calc(5 * var(--u)); }
  .st-text .row { height: calc(23 * var(--u)); }
  .st-text .lab { font-size: calc(12 * var(--u)); }
  .st-text .val { font-size: calc(20 * var(--u)); font-weight: var(--fw-semi); }
  .st-text .lab, .st-text .val, .st-minimal .lab, .st-minimal .val {
    text-shadow:
      calc(-1.6 * var(--u)) calc(-1.6 * var(--u)) 0 rgb(var(--outline-rgb)), calc(1.6 * var(--u)) calc(-1.6 * var(--u)) 0 rgb(var(--outline-rgb)),
      calc(-1.6 * var(--u)) calc(1.6 * var(--u)) 0 rgb(var(--outline-rgb)), calc(1.6 * var(--u)) calc(1.6 * var(--u)) 0 rgb(var(--outline-rgb)),
      0 calc(-1.6 * var(--u)) 0 rgb(var(--outline-rgb)), 0 calc(1.6 * var(--u)) 0 rgb(var(--outline-rgb)),
      calc(-1.6 * var(--u)) 0 0 rgb(var(--outline-rgb)), calc(1.6 * var(--u)) 0 0 rgb(var(--outline-rgb));
  }

  /* --- opener (開幕テンプレ), display.opener_display: om-board (A, a few
     seconds over the board), om-hold (B), om-namebar (C), om-top (D) --- */
  /* opacity comes ~10 times a second with the server state; the transition
     fills the steps in between so the fade is smooth */
  .ob { transition: opacity 0.12s linear; }
  .ob { box-sizing: border-box; white-space: nowrap; font-weight: var(--fw-bold); color: var(--fg);
    background: rgba(var(--bg-rgb),max(0.78, var(--band-a))); border-radius: calc(6 * var(--u)); }
  #ob-left { --acc: var(--p-left); --lab: var(--t-left); }
  #ob-right { --acc: var(--p-right); --lab: var(--t-right); }
  .ob .olab { color: var(--lab, rgb(var(--soft-rgb))); }
  .ob:not(#ob-both) { box-shadow: inset 0 calc(-3 * var(--u)) 0 var(--acc); }
  body.om-board .ob { padding: calc(4 * var(--u)) calc(22 * var(--u)) calc(8 * var(--u)); border-radius: calc(10 * var(--u)); text-align: center; }
  body.om-board .olab { font-size: calc(13 * var(--u)); line-height: calc(22 * var(--u)); }
  body.om-board .oname { font-size: calc(28 * var(--u)); line-height: calc(36 * var(--u)); }
  body.om-hold .ob { padding: calc(3 * var(--u)) calc(12 * var(--u)) calc(6 * var(--u)); }
  body.om-hold .olab { font-size: calc(10 * var(--u)); line-height: calc(14 * var(--u)); }
  body.om-hold .oname { font-size: calc(15 * var(--u)); line-height: calc(20 * var(--u)); }
  body.om-namebar .ob { height: calc(20 * var(--u)); line-height: calc(17 * var(--u)); padding: 0 calc(10 * var(--u));
    font-size: calc(12 * var(--u)); border-radius: 999px; box-shadow: none; border: calc(2 * var(--u)) solid var(--acc); }
  #ob-both { padding: calc(4 * var(--u)) calc(14 * var(--u)) calc(8 * var(--u)); min-width: calc(200 * var(--u));
    background: linear-gradient(to right, var(--p-left) 50%, var(--p-right) 50%) bottom / 100% calc(3 * var(--u)) no-repeat,
                rgba(var(--bg-rgb),max(0.78, var(--band-a))); }
  #ob-both .olab { text-align: center; font-size: calc(11 * var(--u)); line-height: calc(16 * var(--u)); }
  #ob-both .orow { display: flex; align-items: baseline; justify-content: space-between; gap: calc(10 * var(--u)); font-size: calc(18 * var(--u)); }
  #ob-both .ol { color: var(--t-left); } #ob-both .or { color: var(--t-right); }
  #ob-both .ovs { font-size: calc(13 * var(--u)); color: rgb(var(--soft-rgb)); }
  /* the opener names: thickened less than the rest (0.4 of it, as the HUD's OPENER_NAME_THICKEN) */
  .ob .oname, #ob-both .ol, #ob-both .or { -webkit-text-stroke: calc(var(--fw-stroke) * 0.4 * 1em) currentColor; }
  body.style-gauge .ob { border-radius: 0 !important; }
  body.style-pop .ob:not(#ob-both) { background: var(--acc); box-shadow: none; border: calc(2.5 * var(--u)) solid #fff; border-radius: calc(14 * var(--u)); }
  body.style-pop .ob .olab { color: rgb(235,242,255); }
  body.style-text .ob { background: none !important; box-shadow: none; border-color: transparent; }
  body.style-text .ob div, body.style-text .ob span {
    text-shadow: calc(-1.6 * var(--u)) 0 0 rgb(var(--outline-rgb)), calc(1.6 * var(--u)) 0 0 rgb(var(--outline-rgb)),
      0 calc(-1.6 * var(--u)) 0 rgb(var(--outline-rgb)), 0 calc(1.6 * var(--u)) 0 rgb(var(--outline-rgb)); }
  .summary .sop { font-size: calc(12 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --- versus: one block between the boards --- */
  .versus { width: calc(150 * var(--u)); box-sizing: border-box; padding: calc(3 * var(--u)) calc(7 * var(--u));
    background: var(--band); border-radius: calc(4 * var(--u)); }
  .versus .vrow { height: calc(34 * var(--u)); position: relative; }
  .versus .vlab { position: absolute; left: 0; right: 0; top: calc(1 * var(--u)); text-align: center;
    font-size: calc(10 * var(--u)); font-weight: var(--fw-bold); color: rgb(var(--soft-rgb)); }
  .versus .vals { display: flex; justify-content: space-between; font-size: calc(15 * var(--u)); font-weight: var(--fw-bold);
    line-height: calc(19 * var(--u)); }
  .versus .l { color: var(--t-left); } .versus .r { color: var(--t-right); }
  .versus .split { display: flex; height: calc(6 * var(--u)); border-radius: calc(3 * var(--u)); overflow: hidden;
    background: rgba(255,255,255,0.24); margin-top: calc(1 * var(--u)); }
  .versus .split .a { background: var(--p-left); } .versus .split .b { background: var(--p-right); }

  /* --- events and clock: follow the chosen style (body.style-*) like the
     stats do — same looks as the HUD's EventBlock / ClockBlock --- */
  .events {
    padding: calc(2 * var(--u)) calc(6 * var(--u)) calc(2 * var(--u)) calc(11 * var(--u));
    font-size: calc(10 * var(--u)); font-weight: var(--fw-semi); color: rgb(var(--event-rgb));
    line-height: calc(14 * var(--u));
    text-align: right; white-space: nowrap; box-sizing: border-box;
    background: linear-gradient(to right, var(--clear) 0%, var(--band) 45%, var(--band) 100%);
  }
  body.pos-right .events {
    padding: calc(2 * var(--u)) calc(11 * var(--u)) calc(2 * var(--u)) calc(6 * var(--u));
    text-align: left;
    background: linear-gradient(to right, var(--band) 0%, var(--band) 55%, var(--clear) 100%);
  }
  body.style-gauge .events.p-left { box-shadow: inset calc(-2 * var(--u)) 0 0 var(--p-left); }
  body.style-gauge .events.p-right { box-shadow: inset calc(-2 * var(--u)) 0 0 var(--p-right); }
  body.style-gauge.pos-right .events.p-left { box-shadow: inset calc(2 * var(--u)) 0 0 var(--p-left); }
  body.style-gauge.pos-right .events.p-right { box-shadow: inset calc(2 * var(--u)) 0 0 var(--p-right); }
  body.style-text .events { background: none; color: var(--fg); line-height: calc(15 * var(--u)); }
  body.style-pop .events { background: none; display: flex; flex-direction: column; align-items: flex-end;
    gap: calc(3 * var(--u)); padding: calc(2 * var(--u)); line-height: normal; }
  body.style-pop.pos-right .events { align-items: flex-start; }
  body.style-pop .events div { height: calc(16 * var(--u)); line-height: calc(13 * var(--u)); box-sizing: border-box;
    padding: 0 calc(7 * var(--u)); border-radius: 999px; border: calc(1.5 * var(--u)) solid #fff; color: var(--fg); }
  body.style-pop .events.p-left div { background: var(--p-left); }
  body.style-pop .events.p-right div { background: var(--p-right); }

  .clockbox {
    padding: calc(2 * var(--u)) calc(8 * var(--u));
    background: var(--band);
    border-radius: calc(4 * var(--u));
    text-align: center;
  }
  body.style-gauge .clockbox { border-radius: 0; padding-bottom: calc(5 * var(--u));
    background: linear-gradient(to right, var(--p-left) 50%, var(--p-right) 50%) bottom / 100% calc(2.5 * var(--u)) no-repeat, var(--band); }
  body.style-pop .clockbox { background: rgb(var(--pop-rgb)); border: calc(2.5 * var(--u)) solid #fff;
    border-radius: calc(12 * var(--u)); padding: calc(2 * var(--u)) calc(12 * var(--u)); }
  body.style-text .clockbox { background: none; padding: 0 calc(4 * var(--u)); }
  .clock { font-size: calc(18 * var(--u)); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
  .state { font-size: calc(10 * var(--u)); font-weight: var(--fw-semi); color: #fde68a; }
  .status { font-size: calc(10 * var(--u)); font-weight: var(--fw-semi); color: #fca5a5; }
  body.style-text .clockbox div, body.style-text .events, body.style-minimal .clockbox div, body.style-minimal .events {
    text-shadow:
      calc(-1.3 * var(--u)) calc(-1.3 * var(--u)) 0 rgb(var(--outline-rgb)), calc(1.3 * var(--u)) calc(-1.3 * var(--u)) 0 rgb(var(--outline-rgb)),
      calc(-1.3 * var(--u)) calc(1.3 * var(--u)) 0 rgb(var(--outline-rgb)), calc(1.3 * var(--u)) calc(1.3 * var(--u)) 0 rgb(var(--outline-rgb)),
      0 calc(-1.3 * var(--u)) 0 rgb(var(--outline-rgb)), 0 calc(1.3 * var(--u)) 0 rgb(var(--outline-rgb)),
      calc(-1.3 * var(--u)) 0 0 rgb(var(--outline-rgb)), calc(1.3 * var(--u)) 0 0 rgb(var(--outline-rgb));
  }
  /* --- end-of-match summary (same looks as the HUD's SummaryBlock) --- */
  .summary { width: calc(212 * var(--u)); box-sizing: border-box; padding: calc(4 * var(--u)) calc(12 * var(--u)) calc(6 * var(--u));
    background: rgba(var(--bg-rgb),max(0.5, var(--band-a))); border-radius: calc(6 * var(--u)); }
  .summary .stitle { text-align: center; font-size: calc(15 * var(--u)); font-weight: var(--fw-bold); line-height: calc(28 * var(--u)); }
  /* 1P | label | 2P, each centered in its column; the player columns are
     centered at 20% / 80% of the box like hud/overlay.py SummaryBlock.COL_X
     (60.8 = 2 x (0.2 x 212 - 12 padding)) */
  .summary .srow { display: grid; grid-template-columns: calc(60.8 * var(--u)) 1fr calc(60.8 * var(--u));
    align-items: baseline; height: calc(20 * var(--u)); }
  .summary .slab { font-size: calc(12 * var(--u)); font-weight: var(--fw-semi); color: rgb(var(--soft-rgb)); text-align: center; }
  .summary .sl, .summary .sr { font-size: calc(15 * var(--u)); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums;
    text-align: center; min-width: 0; }
  .summary .sl { color: var(--t-left); } .summary .sr { color: var(--t-right); }
  body.style-gauge .summary { border-radius: 0;
    background: linear-gradient(to right, var(--p-left) 50%, var(--p-right) 50%) top / 100% calc(2.5 * var(--u)) no-repeat, rgba(var(--bg-rgb),max(0.5, var(--band-a))); }
  body.style-pop .summary { background: rgb(var(--pop-rgb)); border: calc(2.5 * var(--u)) solid #fff; border-radius: calc(12 * var(--u)); }
  body.style-text .summary { background: none; }
  /* band / gauge: the clock is a plain square box (user's choice) */
  body.style-band .clockbox, body.style-gauge .clockbox { border-radius: 0; }
  body.style-band .clockbox, body.style-gauge .clockbox, body.style-simple .clockbox {
    padding-left: calc(14 * var(--u)); padding-right: calc(14 * var(--u)); }   /* a little wider (user) */
  body.style-text .summary div, body.style-text .summary span, body.style-minimal .summary div, body.style-minimal .summary span {
    text-shadow: calc(-1.3 * var(--u)) 0 0 rgb(var(--outline-rgb)), calc(1.3 * var(--u)) 0 0 rgb(var(--outline-rgb)),
      0 calc(-1.3 * var(--u)) 0 rgb(var(--outline-rgb)), 0 calc(1.3 * var(--u)) 0 rgb(var(--outline-rgb)); }


  /* --- the designs added later (hud/overlay.py NEW_STYLES): frame, slash, hex,
     meter, tower, minimal, trend. Same looks as the HUD. --- */
  .stat.p-left, .events.p-left { --acc: var(--p-left); --tint: var(--t-left); }
  .stat.p-right, .events.p-right { --acc: var(--p-right); --tint: var(--t-right); }
  /* frame (カラー枠): dark box with a border in the player's color (the text color for shared parts) */
  .st-frame { padding: calc(4 * var(--u)) calc(9 * var(--u)); }
  .st-frame .row { height: calc(21 * var(--u)); }
  .st-frame .lab { font-size: calc(12 * var(--u)); color: var(--tint); }
  .st-frame .val { font-size: calc(17 * var(--u)); font-weight: var(--fw-semi); }
  .st-frame, body.style-frame .events, body.style-frame .clockbox, body.style-frame .summary, body.style-frame .ob {
    background: var(--band) !important; border: calc(2 * var(--u)) solid var(--acc, var(--fg)) !important;
    border-radius: calc(5 * var(--u)) !important; box-shadow: none !important; }
  body.style-frame .clockbox { padding: calc(2 * var(--u)) calc(14 * var(--u)); }
  /* slash: each row a slanted box with a player-color edge, stepped like stairs */
  .st-slash { padding: calc(2 * var(--u)) 0; }
  .st-slash .row { height: calc(20 * var(--u)); margin: calc(2 * var(--u)) 0; align-items: center;
    background: var(--band); border-left: calc(4 * var(--u)) solid var(--acc);
    transform: skewX(-17deg); padding: 0 calc(10 * var(--u)) 0 calc(8 * var(--u)); width: max-content; }
  .st-slash .row > * { transform: skewX(17deg); }
  .st-slash.hug-r .row { margin-left: auto; }
  .st-slash .lab { font-size: calc(11 * var(--u)); color: var(--tint); }
  .st-slash .val { font-size: calc(15 * var(--u)); font-weight: var(--fw-semi); }
  body.style-slash .events, body.style-slash .clockbox, body.style-slash .ob {
    background: var(--band) !important; transform: skewX(-12deg); border-radius: 0 !important; box-shadow: none !important; }
  body.style-slash .events, body.style-slash #ob-left, body.style-slash #ob-right { border-left: calc(4 * var(--u)) solid var(--acc) !important; }
  body.style-slash .events > div, body.style-slash .clockbox > div, body.style-slash .ob > * { transform: skewX(12deg); }
  body.style-slash .clockbox { padding-left: calc(18 * var(--u)); padding-right: calc(18 * var(--u)); }
  /* the opener name box: longer, so the name keeps clear of the slanted ends (as the HUD) */
  body.style-slash .ob { padding-left: calc(34 * var(--u)) !important; padding-right: calc(34 * var(--u)) !important; }
  body.style-slash.om-namebar .ob { padding-left: calc(18 * var(--u)) !important; padding-right: calc(18 * var(--u)) !important; }
  body.style-slash .summary { background: rgba(var(--bg-rgb),max(0.5, var(--band-a))); border-radius: 0; }
  /* hex: each number in a hexagon with a player-color rim; a honeycomb two wide that grows downward */
  .st-hex { --hw: calc(54 * var(--u)); padding: calc(1 * var(--u)); }
  .st-hex .hxwrap { position: relative; }
  .st-hex.hug-r .hxwrap { margin-left: auto; }
  .st-hex .hx { position: absolute; width: var(--hw); height: calc(var(--hw) * 0.88);
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background: var(--acc);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .st-hex .hx::before { content: ""; position: absolute; inset: calc(1.6 * var(--u));

  if (vs.length < 2) return `<svg viewBox="0 0 46 13" preserveAspectRatio="none"><line x1="0" y1="6.5" x2="46" y2="6.5" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/></svg>`;
  const lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo;
  const pts = vs.map((x, i) => `${(46 * i / (vs.length - 1)).toFixed(1)},${(span < 1e-9 ? 6.5 : 13 - 13 * (x - lo) / span).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 46 13" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
const frac = (key, x) => x == null ? 0 : Math.max(0, Math.min(1, x / GAUGE_MAX[key]));

function statRowsHtml(st, side, v) {
  const keys = shownKeys();
  if (st === "hex") {   // two side by side at most, the right one half lower, more rows below (as the HUD's hex_cells)
    const cells = keys.map((_, i) => [i % 2, Math.floor(i / 2) + (i % 2 ? 0.5 : 0)]);
    const w = Math.max(0, ...cells.map(([c]) => c)) * 0.78 + 1, h = (Math.max(0, ...cells.map(([, r]) => r)) + 1) * 0.88;
    return `<div class="hxwrap" style="width:calc(var(--hw) * ${w});height:calc(var(--hw) * ${h.toFixed(2)})">` +
      keys.map((key, i) => `<div class="hx" style="left:calc(var(--hw) * ${(cells[i][0] * 0.78).toFixed(2)});` +
        `top:calc(var(--hw) * ${(cells[i][1] * 0.88).toFixed(2)})"><span class="lab">${labelFor(key)}</span>` +
        `<span class="val num">${fmt(key, v[key])}</span></div>`).join("") + `</div>`;
  }
  if (st === "tower") return keys.map((key) =>
    `<div class="tw"><span class="val num">${fmt(key, v[key])}</span><div class="tb"><i style="height:${(frac(key, v[key]) * 100).toFixed(1)}%"></i></div>` +
    `<span class="lab">${labelFor(key)}</span></div>`).join("");
  if (st === "meter" && keys.length) {
    const [first, ...rest] = keys;
    const arc = "M 8 44 A 27 27 0 0 1 62 44";
    const rows = rest.map((key) => `<div class="row"><span class="lab">${labelFor(key)}</span><span class="val num v-${key}">${fmt(key, v[key])}</span></div>`).join("");
    return (rest.length ? `<div class="mrows">${rows}</div>` : "") +
      `<div class="mbox"><svg viewBox="0 0 70 48"><path d="${arc}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6.5" stroke-linecap="round"/>` +
      (frac(first, v[first]) > 0 ? `<path d="${arc}" fill="none" stroke="var(--acc)" stroke-width="6.5" stroke-linecap="round" pathLength="100" stroke-dasharray="${(frac(first, v[first]) * 100).toFixed(1)} 200"/>` : "") +
      `</svg><div class="mval num">${fmt(first, v[first])}</div><div class="mlab">${labelFor(first)}</div></div>`;
  }
  const n = keys.length;
  return keys.map((key, i) => {
    const lab = `<span class="lab">${labelFor(key)}</span>`;
    const val = `<span class="val num v-${key}">${fmt(key, v[key])}</span>`;
    if (st === "pop") return `<div class="row"><span class="pill">${lab}${val}</span></div>`;
    if (st === "gauge")
      return `<div class="row">${lab}${val}<div class="bar"><i style="width:${(frac(key, v[key]) * 100).toFixed(1)}%"></i></div></div>`;
    if (st === "trend") return `<div class="row">${lab}${sparkSvg(side, key)}${val}</div>`;
    if (st === "slash") {   // stepping toward the board going down (as the HUD)
      const step = `calc(${(n - 1 - i) * 6} * var(--u))`;
      return `<div class="row" style="margin-${display.stats_position === "right" ? "left" : "right"}:${step}">${lab}${val}</div>`;
    }
    return `<div class="row">${lab}${val}</div>`;
  }).join("");
}

function versusHtml(left, right, puyo) {
  // puyo: {left, right} — a Puyo side's numbers are left out, and the bar stays even
  return shownKeys().map((key) => {
    const a = left[key] || 0, b = right[key] || 0, total = a + b;
    const split = total > 0 && !puyo.left && !puyo.right
      ? `<div class="a" style="width:${(a / total * 100).toFixed(1)}%"></div><div class="b" style="flex:1"></div>`
      : "";
    return `<div class="vrow"><div class="vlab">${labelFor(key)}</div>` +
      `<div class="vals"><span class="l num">${puyo.left ? "" : fmt(key, left[key])}</span>` +
      `<span class="r num">${puyo.right ? "" : fmt(key, right[key])}</span></div>` +
      `<div class="split">${split}</div></div>`;
  }).join("");
}

function summaryHtml(state) {
  const side = (data) => ({ ...values(data), ...((data || {}).match_stats || {}) });
  const L = side(state.left), R = side(state.right);
  const f = (v, dec) => v == null ? "--" : Number(v).toFixed(dec);
  const s = Math.max(0, Math.floor(state.match_elapsed_s || 0));
  const time = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const cell = (cls, v, dec, puyo) => puyo ? `<span class="${cls}"></span>`   // a Puyo side's column stays empty
    : dec === null ? `<span class="${cls} sop">${esc(v || "--")}</span>` : `<span class="${cls}">${f(v, dec)}</span>`;
  const items = Array.isArray(display.summary_items) ? display.summary_items : SUMMARY_ROWS.map(([k]) => k);
  return `<div class="stitle">${ui().summary}&nbsp;&nbsp;${time}</div>` +
    SUMMARY_ROWS.filter(([key]) => items.includes(key)).map(([key, lab, dec]) =>
    `<div class="srow">${cell("sl", L[key], dec, isPuyo(state.left))}<span class="slab">${ui()[lab]}</span>` +
    `${cell("sr", R[key], dec, isPuyo(state.right))}</div>`).join("");
}

// display.bg_color / text_color -> CSS variables; the in-between colors are
// mixed the same way as hud/overlay.py set_colors.
const hexRgb = (h) => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); const v = m ? m[1] : "ffffff";
  return [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16)); };
const mixRgb = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
function setColors(target, bgHex, textHex, opacity, lineHex) {
  // target: the root (overall look) or one part's element (display.parts)
  const bg = hexRgb(bgHex || "#000000"), fg = hexRgb(textHex || "#ffffff"), white = [255, 255, 255];
  const set = (k, v) => target.style.setProperty(k, v);
  set("--bg-rgb", bg.join(","));
  set("--band", `rgba(${bg.join(",")},${opacity})`);
  set("--clear", `rgba(${bg.join(",")},0)`);
  set("--band-a", opacity);
  set("--fg", `rgb(${fg.join(",")})`);
  set("--soft-rgb", mixRgb(fg, bg, 0.12).join(","));
  set("--event-rgb", mixRgb(fg, bg, 0.1).join(","));
  set("--pop-rgb", mixRgb(bg, white, 0.08).join(","));
  set("--outline-rgb", mixRgb(bg, white, 0.06).join(","));
  const lum = (0.299 * fg[0] + 0.587 * fg[1] + 0.114 * fg[2]) / 255;
  set("--to", lum >= 0.5 ? "#000" : "#fff");   // the text outline contrasts with the text
  // the minimal design's lines (its background: the background strength, their own color)
  set("--line-rgb", hexRgb(lineHex || "#ffffff").join(","));
}

// display.player_color_left / right (and the lighter text tints, as in the HUD)
function setPlayerColors(leftHex, rightHex) {
  const set = (k, v) => document.documentElement.style.setProperty(k, v);
  for (const [side, hex] of [["left", leftHex], ["right", rightHex]]) {
    const c = hexRgb(hex);
    set(`--p-${side}`, `rgb(${c.join(",")})`);
    set(`--t-${side}`, `rgb(${mixRgb(c, [255, 255, 255], 0.45).join(",")})`);
  }
}

// display.parts: a part's own size / colors / background, else the overall ones
const PART_ELEMENTS = { stats: ["stat-left", "stat-right", "versus"], events: ["ev-left", "ev-right"],
                        clock: ["clockbox"], summary: ["summary"], opener: ["ob-left", "ob-right", "ob-both"] };
const partValue = (part, key) => {
  const own = ((display.parts || {})[part] || {})[key];
  return own == null ? display[key] : own;
};

// display.font_family / font_file. A loaded file lives in assets/user_fonts/
// (next to this page's folder) and is registered under the family name the
// settings window saved for it.
let loadedFontFile = "";
function setFont(family, file) {
  const fam = (family || "").replace(/["\\]/g, "");
  if (file && file !== loadedFontFile && /^user_fonts\/[^\/\\]+\.(ttf|otf|ttc)$/i.test(file)) {
    loadedFontFile = file;
    const face = new FontFace(fam || "UserFont", `url("../assets/${encodeURI(file)}")`);
    face.load().then((f) => { document.fonts.add(f); layout(); }).catch(() => {});
  }
  const name = fam || (file ? "UserFont" : "");
  document.body.style.fontFamily = name ? `"${name}", "Segoe UI", "Yu Gothic UI", sans-serif` : "";
}

function layout() {
  const k = window.innerWidth / REF_W;          // screen px per reference px
  const d = display, st = style();
  document.documentElement.style.setProperty("--u", (k * d.scale) + "px");
  setColors(document.documentElement, d.bg_color, d.text_color, d.background_opacity, d.line_color);
  setPlayerColors(d.player_color_left, d.player_color_right);
  for (const [part, ids] of Object.entries(PART_ELEMENTS)) {
    for (const id of ids) {
      const el = $(id);
      el.style.setProperty("--u", (k * partValue(part, "scale")) + "px");
      setColors(el, partValue(part, "bg_color"), partValue(part, "text_color"), partValue(part, "background_opacity"),
                partValue(part, "line_color"));
    }
  }
  const su = k * partValue("stats", "scale");   // the gaps next to the stat block go with its size
  setFont(d.font_family, d.font_file);
  const [fwBold, fwSemi, fwStroke] = weightStyle(d.text_weight);
  document.body.classList.toggle("outlined", !!d.text_outline);
  document.documentElement.style.setProperty("--fw-bold", fwBold);
  document.documentElement.style.setProperty("--fw-semi", fwSemi);
  document.documentElement.style.setProperty("--fw-stroke", fwStroke);
  const mode = d.stats_position === "right" ? "right" : "left";
  document.body.classList.toggle("pos-right", mode === "right");
  for (const s of STYLES) document.body.classList.toggle("style-" + s, s === st);
  const anyStat = shownKeys().length > 0;
  const showStat = anyStat && st !== "versus";

  for (const side of ["left", "right"]) {
    const stat = $("stat-" + side), ev = $("ev-" + side);
    const shown = showStat && !isPuyo((lastState || {})[side]);   // a side playing Puyo shows nothing
    stat.className = `abs stat st-${st} p-${side} ${mode === "left" ? "hug-r" : "hug-l"}` + (shown ? "" : " hidden");
    stat.style.setProperty("--slot", Math.max(2, ...shownKeys().map((k2) => SLOT_CH[k2])) + "ch");
    // against a Puyo player the Tetris frame is wider (hud/overlay.py VS_PUYO_SHIFT_X)
    const otherData = (lastState || {})[side === "left" ? "right" : "left"] || {};
    const vsPuyo = otherData.puyo ? (mode === "left" ? -12 : 0) : 0;
    const x = (STAT_ANCHOR_X[mode][side] + vsPuyo + d.offset_x + (d[`stats_${side}_offset_x`] || 0)) * k   // both, then this player's own
      + (NEW_STYLES.includes(st) ? NEW_STYLE_GAP * su * (mode === "left" ? -1 : 1) : 0);
    const ex = x + d.event_offset_x * k;    // events: stacked above the stats, then their own offset
    let bottom = (STAT_BOTTOM_Y + d.offset_y + (d[`stats_${side}_offset_y`] || 0)) * k;
    for (const [el, ax] of [[stat, x], [ev, ex]]) {
      el.style.left = mode === "left" ? "auto" : ax + "px";
      el.style.right = mode === "left" ? (window.innerWidth - ax) + "px" : "auto";
    }
    if (shown) {
      stat.style.top = (bottom - stat.offsetHeight) + "px";
      bottom -= stat.offsetHeight + EVENT_GAP * su;
    }
    ev.style.top = (bottom + d.event_offset_y * k - ev.offsetHeight) + "px";
  }
  const cb = $("clockbox");
  cb.classList.toggle("hidden", !d.show_clock);
  const clockTop = CLOCK_BOTTOM_Y * k - cb.offsetHeight;   // default spot (the versus block uses it)
  cb.style.left = ((CLOCK_CENTER_X + d.clock_offset_x) * k - cb.offsetWidth / 2) + "px";
  cb.style.top = (clockTop + d.clock_offset_y * k) + "px";

  // versus: centered between the boards, just above the clock; offsets move it too.
  const vs = $("versus");
  vs.classList.toggle("hidden", !(anyStat && st === "versus"));
  const vb = d.show_clock ? clockTop - VERSUS_GAP * su : CLOCK_BOTTOM_Y * k;
  vs.style.left = ((CLOCK_CENTER_X + d.offset_x) * k - vs.offsetWidth / 2) + "px";
  vs.style.top = (vb + d.offset_y * k - vs.offsetHeight) + "px";

  // opener (開幕テンプレ): where display.opener_display says
  const om = OPENER_DISPLAYS.includes(d.opener_display) ? d.opener_display : "board";
  for (const m of OPENER_DISPLAYS) document.body.classList.toggle("om-" + m, m === om);
  const st0 = lastState || {};
  const nameOf = (data) => isPuyo(data) ? null : openerOf(data);
  const names = { left: nameOf(st0.left), right: nameOf(st0.right) };
  for (const id of ["ob-left", "ob-right", "ob-both"]) $(id).classList.add("hidden");
  const alphas = { left: names.left ? popupAlpha(st0.left, st0.frozen, d.opener_seconds) : 0,
                   right: names.right ? popupAlpha(st0.right, st0.frozen, d.opener_seconds) : 0 };
  catStateTime = performance.now();   // ages just arrived with this state
  if (om === "cat") { if (!catRunning) catTick(); }
  else for (const side of ["left", "right"]) $("cat-" + side).classList.add("hidden");
  if (om === "cat") { /* names shown by the cat (catTick) */ }
  else if (d.show_opener && om === "top" && Math.max(alphas.left, alphas.right) > 0) {
    // one box for both: up while either name is still within its few seconds
    const ob = $("ob-both");
    ob.classList.remove("hidden");
    ob.style.opacity = Math.max(alphas.left, alphas.right);
    const [odx, ody] = openerOffset(d, "both");
    ob.style.left = ((OPENER_TOP_CENTER_X + odx) * k - ob.offsetWidth / 2) + "px";
    ob.style.top = ((OPENER_TOP_Y + ody) * k) + "px";
  } else if (d.show_opener && om !== "top") {
    for (const side of ["left", "right"]) {
      const alpha = alphas[side];
      if (alpha <= 0) continue;
      const ob = $("ob-" + side);
      ob.classList.remove("hidden");
      ob.style.opacity = alpha;
      let x, y;
      if (om === "board") { x = BOARD_CENTER_X[side] * k - ob.offsetWidth / 2; y = OPENER_BOARD_TOP_Y * k; }
      else if (om === "hold") { x = HOLD_RIGHT_X[side] * k - ob.offsetWidth; y = OPENER_HOLD_TOP_Y * k; }
      else { x = side === "left" ? NAMEBAR_RIGHT_X * k - ob.offsetWidth : NAMEBAR_LEFT_X * k; y = NAMEBAR_TOP_Y * k; }
      const [odx, ody] = openerOffset(d, side);
      ob.style.left = (x + odx * k) + "px";
      ob.style.top = (y + ody * k) + "px";
    }
  }

  // summary: while a finished match is on screen
  const sm = $("summary");
  const ready = lastState && lastState.frozen && (lastState.match_elapsed_s || 0) > 0;
  sm.classList.toggle("hidden", !(d.show_summary && ready));
  sm.style.left = ((CLOCK_CENTER_X + d.summary_offset_x) * k - sm.offsetWidth / 2) + "px";
  sm.style.top = ((SUMMARY_TOP_Y + d.summary_offset_y) * k) + "px";
}

function alignStatColumns(box) {
  const labs = [...box.querySelectorAll(box.classList.contains("st-meter") ? ".mrows .lab" : ".lab")];
  labs.forEach((l) => { l.style.minWidth = ""; });
  if (["st-gauge", "st-hex", "st-tower"].some((c) => box.classList.contains(c))) return;
  const w = Math.max(0, ...labs.map((l) => l.getBoundingClientRect().width));
  labs.forEach((l) => { l.style.minWidth = w + "px"; });
}

function renderSide(side, data) {
  const box = $("stat-" + side);
  box.innerHTML = statRowsHtml(style(), side, values(data));
  alignStatColumns(box);
  const ev = $("ev-" + side);
  const log = ((data || {}).event_log || []).slice(0, display.event_log_count).reverse();  // oldest on top
  const key = display.language === "en" ? "text_en" : "text";
  const text = (e) => (e.ren_source === "opener" && e.opener)    // an opener: its name in openerLang()
    ? (display.language === "en" ? "Opener: " : "開幕：") + ((openerLang() === "en" && e.opener_en) || e.opener)
    : (e[key] || e.text || "");
  ev.innerHTML = log.map((e) => `<div>${esc(text(e))}</div>`).join("");
  ev.classList.toggle("hidden", !(display.show_event_log && log.length && !isPuyo(data)));
}

function render(state) {
  if (state.display) display = { ...DEFAULTS, ...state.display };
  if (display.players === "left" || display.players === "right") {   // 1P / 2P only
    const other = display.players === "left" ? "right" : "left";
    state[other] = { ...(state[other] || {}), hidden: true };
  }
  for (const side of ["left", "right"]) recordHistory(side, state[side], state.match_elapsed_s);
  renderSide("left", state.left);
  renderSide("right", state.right);
  $("versus").innerHTML = versusHtml(values(state.left), values(state.right),
                                     { left: isPuyo(state.left), right: isPuyo(state.right) });
  $("summary").innerHTML = summaryHtml(state);
  const lab = ui().s_opener, sep = display.language === "en" ? ": " : "：";
  for (const side of ["left", "right"]) {
    const name = esc(openerOf(state[side]) || "");
    $("ob-" + side).innerHTML = display.opener_display === "namebar"
      ? `<span class="olab">${lab}${sep}</span><span class="oname">${name}</span>`
      : `<div class="olab">${lab}</div><div class="oname">${name}</div>`;
  }
  $("ob-both").innerHTML = `<div class="olab">${lab}</div><div class="orow">` +
    `<span class="ol">${esc(openerOf(state.left) || "--")}</span><span class="ovs">vs</span>` +
    `<span class="or">${esc(openerOf(state.right) || "--")}</span></div>`;
  // Match clock is game time: it stops while paused and resumes after.
  const s = Math.max(0, Math.floor(state.match_elapsed_s || 0));
  $("clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("state").textContent = state.frozen ? ui().frozen
    : state.paused ? ui().paused
    : state.waiting_start ? ui().waiting : "";
  document.body.classList.toggle("away", display.enabled === false   // switched off
    || (!display.always_show && !display.force_show && state.match_screen === false));
  const captureDown = state.capture && state.capture.ok === false;
  document.body.classList.toggle("stale", !!captureDown);
  const msg = (display.language === "en" && state.capture && state.capture.message_en) || (state.capture || {}).message;
  $("status").textContent = captureDown ? ui().down + ": " + msg : "";
  layout();
}

function connect() {
  const ws = new WebSocket("ws://127.0.0.1:8765");
  ws.onopen = () => { $("status").textContent = ""; layout(); };
  ws.onclose = () => {
    $("status").textContent = ui().disconnected;
    layout();
    setTimeout(connect, 2000);
  };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (event) => {
    lastState = JSON.parse(event.data);
    // OBS keeps a page as it first loaded it: when the app's files change
    // (an update, a new cat) the server says so and the page loads them again
    // (user: the cat wasn't in OBS — it still had the page from before the cat).
    if (lastState.page_rev) {
      if (pageRev === null) pageRev = lastState.page_rev;
      else if (lastState.page_rev !== pageRev) { location.reload(); return; }
    }
    render(lastState);
  };
}
window.addEventListener("resize", layout);
render({});
connect();
</script>
</body>
</html>
