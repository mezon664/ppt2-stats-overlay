<!DOCTYPE html>

<style>
  /* Size this browser source to cover the game capture exactly (16:9).
     Everything is drawn on one canvas by the same steps as the desktop HUD
     (hud/overlay.py: each part's paintEvent and HudWindow._place), so the two
     look the same (user's request). The server sends the "display" settings
     with every update, so changes made in the settings window apply here too. */

  canvas { position: absolute; left: 0; top: 0; }

<script>
"use strict";
// ======================================================================

// Sizes are reference px (1232x692 game client) x u.
// ======================================================================
const REF_W = 1232;

const VS_PUYO_SHIFT_X = { left: -12, right: 0 };
const STAT_BOTTOM_Y = 562, EVENT_GAP = 2, VERSUS_GAP = 4;

const GAUGE_MAX = { apm: 120, pps: 4, app: 1, attack: 100, pieces: 300, ren: 12, b2b: 10 };

const STATE_RGB = [253, 230, 138], STATUS_RGB = [252, 165, 165];
const STAT_KEYS = ["apm", "pps", "app", "attack", "pieces", "ren", "b2b"];
const VALUE_TEMPLATES = { apm: "DDD.D", pps: "D.DD", app: "D.DD", attack: "DDD", pieces: "DDDD", ren: "DD", b2b: "xDD" };
const DEFAULT_LABELS = { apm: "APM", pps: "PPS", app: "APP", attack: "ATK", pieces: "PIECES", ren: "REN", b2b: "B2B" };
const DEFAULT_LABELS_EN = { ...DEFAULT_LABELS, ren: "COMBO" };   // the English game says "Combo" for REN
const UI_TEXT = {
  ja: { frozen: "試合終了", paused: "試合中断中", waiting: "スタート待ち", capture_down: "認識不可",
        summary: "試合結果", s_opener: "開幕", s_apm: "APM", s_pps: "PPS", s_app: "APP",

        summary: "Match summary", s_opener: "Opener", s_apm: "APM", s_pps: "PPS", s_app: "APP",
        s_lines: "Lines sent", s_pieces: "Pieces", s_max_ren: "Max combo",
        s_tetris: "TETRIS", s_tspin: "T-SPIN", s_pc: "Perfect clear",
        s_tss: "T-SPIN Single", s_tsd: "T-SPIN Double", s_tst: "T-SPIN Triple", s_tsm: "T-SPIN Mini",
        connecting: "Connecting...", disconnected: "Disconnected. Reconnecting..." },
};
const SUMMARY_ROWS = [   // [key, label, decimals; null = text] (hud/overlay.py SUMMARY_ROWS)
  ["opener", "s_opener", null], ["apm", "s_apm", 1], ["pps", "s_pps", 2], ["app", "s_app", 2],
  ["lines_sent", "s_lines", 0], ["pieces", "s_pieces", 0], ["max_ren", "s_max_ren", 0], ["tetris", "s_tetris", 0],
  ["tspin", "s_tspin", 0], ["tspin_single", "s_tss", 0], ["tspin_double", "s_tsd", 0], ["tspin_triple", "s_tst", 0],
  ["tspin_mini", "s_tsm", 0], ["perfect_clear", "s_pc", 0]];
const DEFAULTS = { style: "gauge", always_show: false, force_show: false, enabled: true, opener_language: "auto",
  opener_seconds: 4, players: "both", text_weight: 65, text_outline: true, text_outline_width: 10, bg_color: "#000000", text_color: "#ffffff",
  line_color: "#ffffff", font_family: "Meiryo", font_file: "", language: "ja", stats_position: "left", stats_position_left: "", stats_position_right: "", scale: 1.0,
  offset_x: 0, offset_y: 0, clock_offset_x: 0, clock_offset_y: 0, event_offset_x: 0, event_offset_y: 0,
  summary_offset_x: 0, summary_offset_y: 0, session_offset_x: 0, session_offset_y: 0,
  stats_left_offset_x: 0, stats_left_offset_y: 0,
  stats_right_offset_x: 0, stats_right_offset_y: 0, opener_offset_x: 0, opener_offset_y: 0,
  opener_left_offset_x: 0, opener_left_offset_y: 0, opener_right_offset_x: 0, opener_right_offset_y: 0,
  show_on_hud: true, show_on_obs: true, show_summary: true, show_session: false, show_opener: true, opener_display: "board", background_opacity: 0.85,
  stat_items: ["apm", "pps", "app"], labels: {}, player_color_left: "#3b8eea", player_color_right: "#e5484d",
  parts: {}, show_clock: true, show_event_log: false, event_log_count: 3,
  summary_items: ["opener", "apm", "pps", "app", "lines_sent", "pieces", "max_ren", "tetris", "tspin", "perfect_clear"] };

// --- small helpers ---
const int = Math.trunc;                        // Python int()
function pyRound(x) {                          // Python round(): halves to even
  const f = Math.floor(x), d = x - f;
  return d > 0.5 ? f + 1 : d < 0.5 ? f : (f % 2 === 0 ? f : f + 1);
}
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const hexRgb = (h) => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); const v = m ? m[1] : "ffffff";
  return [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16)); };
const mix = (a, b, t) => a.map((x, i) => pyRound(x + (b[i] - x) * t));
// OBS lays a browser source over the scene in linear light (its "SrgbDecompress"
// drawing), while Windows lays the HUD over the game on the sRGB values, so a
// see-through color looked lighter in OBS than on the HUD (user: the
// background strength differs; the same only when fully solid or clear). A
// see-through color's alpha is changed so that OBS's blend comes out as the
// HUD's would, over a mid-gray backdrop (exact for black, the usual band).
const toLinear = (v) => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
const obsAlphaCache = new Map();
function obsAlpha(c, a) {
  if (!(a > 0 && a < 1)) return a;
  const f = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255, key = f.toFixed(3) + "|" + a.toFixed(4);
  let out = obsAlphaCache.get(key);
  if (out === undefined) {
    const back = 0.5, want = toLinear(f * a + back * (1 - a));
    // OBS: the page's premultiplied color made linear, plus the backdrop's share
    const got = (x) => toLinear(f * x) + toLinear(back) * (1 - x);
    let lo = 0, hi = 1;   // got() runs from the backdrop to the color: one direction
    const up = got(1) > got(0);
    for (let i = 0; i < 30; i++) {
      const mid = (lo + hi) / 2;
      if ((got(mid) < want) === up) lo = mid; else hi = mid;
    }
    out = Math.abs(got(1) - got(0)) < 1e-6 ? a : (lo + hi) / 2;
    if (obsAlphaCache.size > 2000) obsAlphaCache.clear();
    obsAlphaCache.set(key, out);
  }
  return out;
}
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${obsAlpha(c, a).toFixed(4)})`;
const luminance = (c) => (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
const $ = (id) => document.getElementById(id);

// --- colors (hud/overlay.py set_colors / set_player_colors / use_colors) ---
let BAND_RGB = [0, 0, 0], WHITE = [255, 255, 255], LINE_RGB = [255, 255, 255], SOFT, EVENT_RGB,
    POP_CLOCK_RGB, OUTLINE_RGB, TEXT_OUTLINE_RGB = [0, 0, 0];
let PLAYER_COLORS = { left: [59, 142, 234], right: [229, 72, 77] };
let PLAYER_TEXT_COLORS = { left: [140, 200, 255], right: [255, 154, 158] };
function setColors(bgHex, textHex, lineHex = "#ffffff") {
  BAND_RGB = hexRgb(bgHex); WHITE = hexRgb(textHex); LINE_RGB = hexRgb(lineHex);
  SOFT = mix(WHITE, BAND_RGB, 0.12);
  EVENT_RGB = mix(WHITE, BAND_RGB, 0.1);
  POP_CLOCK_RGB = mix(BAND_RGB, [255, 255, 255], 0.08);
  OUTLINE_RGB = mix(BAND_RGB, [255, 255, 255], 0.06);
  TEXT_OUTLINE_RGB = luminance(WHITE) >= 0.5 ? [0, 0, 0] : [255, 255, 255];
}
setColors("#000000", "#ffffff");
function setPlayerColors(leftHex, rightHex) {
  PLAYER_COLORS = { left: hexRgb(leftHex), right: hexRgb(rightHex) };
  PLAYER_TEXT_COLORS = { left: mix(PLAYER_COLORS.left, [255, 255, 255], 0.45),
                         right: mix(PLAYER_COLORS.right, [255, 255, 255], 0.45) };
}
const useColors = (part) => { if (part.colors) setColors(...part.colors); };

// --- text (hud/overlay.py weight_style / _font / text_width / draw_text / elide) ---
// display.text_weight (0-100): Regular thickened a little up to 30, then Bold thickened more
function weightStyle(value) {
  let v = Number(value);
  if (!(v >= 0 || v < 0)) v = 65;
  v = Math.min(100, Math.max(0, v));
  return v < 30 ? [400, 400, 0.04 * v / 30] : [700, 700, 0.10 * (v - 30) / 70];
}
let [BOLD, SEMI, THICKEN] = weightStyle(65);
let TEXT_OUTLINE = 0;
let FONT_CSS = '"Segoe UI", "Yu Gothic UI", sans-serif';
const fontOf = (px, weight) => `${weight} ${Math.max(7, pyRound(px))}px ${FONT_CSS}`;
const measureCtx = document.createElement("canvas").getContext("2d");
const widthCache = new Map();
// Qt (the HUD) lays text out with each character's width rounded to whole
// pixels; the browser keeps the fractions, so lines came out a little longer
// and boxes sized from them a pixel or two wider. Measured and placed the Qt way.
function charWidth(font, c) {
  const key = font + "\u0000" + c;
  let w = widthCache.get(key);
  if (w === undefined) {
    measureCtx.font = font;
    w = Math.round(measureCtx.measureText(c).width);
    if (widthCache.size > 4000) widthCache.clear();
    widthCache.set(key, w);
  }
  return w;
}
function textWidth(px, weight, text) {
  const font = fontOf(px, weight);
  let w = 0;
  for (const c of text) w += charWidth(font, c);
  return w;
}
// each character at its Qt position: op(ctx, char, x)
function eachChar(ctx, font, text, x, op) {
  for (const c of text) { op(c, x); x += charWidth(font, c); }
}
function elide(text, px, weight, width) {
  if (textWidth(px, weight, text) <= width) return text;
  const chars = [...text];
  for (let n = chars.length - 1; n > 0; n--) {
    const t = chars.slice(0, n).join("") + "…";
    if (textWidth(px, weight, t) <= width) return t;
  }
  return "…";
}
let layerCanvas = null;
// Draws text with its left / right / center at x and its baseline at y; returns its width
function drawText(ctx, x, y, text, px, weight, color, align = "left", outline = 0, alpha = 1, thickenShare = 1) {
  const font = fontOf(px, weight);
  const w = textWidth(px, weight, text);
  if (align === "right") x -= w; else if (align === "center") x -= w / 2;
  // The browser draws letters a little heavier than Qt does (user: OBS's text
  // looked slightly bold and smudged), so it's thickened less here: measured
  // against the HUD at text weights 15 / 40 / 65 / 100 (the light text's
  // amount within ±6%, tools/validation/hud_vs_obs.py)
  const thicken = THICKEN * thickenShare * px * (BOLD >= 700 ? Math.min(1, 0.4 + 4 * THICKEN) : 0.3);
  outline = Math.max(outline, TEXT_OUTLINE * px);
  ctx.font = font; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.lineJoin = "round";
  if (outline > 0) {
    ctx.strokeStyle = rgba(TEXT_OUTLINE ? TEXT_OUTLINE_RGB : OUTLINE_RGB, alpha);
    ctx.lineWidth = outline * 2 + thicken;   // still shows around the thickened glyphs
    eachChar(ctx, font, text, x, (c, cx) => ctx.strokeText(c, cx, y));
  }
  if (thicken > 0 && alpha < 1) {
    // fill + stroke opaque on a layer, then the layer at alpha (the stroke must not double the alpha)
    const m = ctx.measureText(text), k = ctx.getTransform().a;
    const pad = thicken + 2;
    const left = x - pad, top = y - m.fontBoundingBoxAscent - pad;
    const lw = w + 2 * pad, lh = m.fontBoundingBoxAscent + m.fontBoundingBoxDescent + 2 * pad;
    layerCanvas = layerCanvas || document.createElement("canvas");
    layerCanvas.width = Math.ceil(lw * k) + 2; layerCanvas.height = Math.ceil(lh * k) + 2;
    const q = layerCanvas.getContext("2d");
    q.setTransform(k, 0, 0, k, 0, 0);
    q.translate(-left, -top);
    q.font = font; q.textAlign = "left"; q.textBaseline = "alphabetic"; q.lineJoin = "round";
    q.fillStyle = rgba(color); q.strokeStyle = rgba(color); q.lineWidth = thicken;
    eachChar(q, font, text, x, (c, cx) => { q.fillText(c, cx, y); q.strokeText(c, cx, y); });
    const dev = new DOMPoint(left, top).matrixTransform(ctx.getTransform());
    ctx.save();
    ctx.globalAlpha *= obsAlpha(color, alpha);   // (see obsAlpha)
    ctx.setTransform(1, 0, 0, 1, 0, 0);   // the layer is already at device pixels
    ctx.drawImage(layerCanvas, dev.x, dev.y);
    ctx.restore();
    return w;
  }
  ctx.fillStyle = rgba(color, alpha);
  ctx.strokeStyle = rgba(color, alpha);
  ctx.lineWidth = thicken;
  eachChar(ctx, font, text, x, (c, cx) => { ctx.fillText(c, cx, y); if (thicken > 0) ctx.strokeText(c, cx, y); });
  return w;
}

// --- shapes (Qt drawRoundedRect / polygons) ---
function roundRectPath(ctx, x, y, w, h, r) {
  const rx = Math.max(0, Math.min(r, w / 2)), ry = Math.max(0, Math.min(r, h / 2));
  ctx.beginPath();
  if (rx <= 0 || ry <= 0) { ctx.rect(x, y, w, h); return; }
  ctx.moveTo(x + rx, y);
  ctx.lineTo(x + w - rx, y); ctx.ellipse(x + w - rx, y + ry, rx, ry, 0, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - ry); ctx.ellipse(x + w - rx, y + h - ry, rx, ry, 0, 0, Math.PI / 2);
  ctx.lineTo(x + rx, y + h); ctx.ellipse(x + rx, y + h - ry, rx, ry, 0, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + ry); ctx.ellipse(x + rx, y + ry, rx, ry, 0, Math.PI, Math.PI * 1.5);
  ctx.closePath();
}
// fill and/or stroke (pen: [color, width]) a rounded rect, like QPainter.drawRoundedRect
function roundRect(ctx, x, y, w, h, r, fill, pen) {
  roundRectPath(ctx, x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (pen) { ctx.strokeStyle = pen[0]; ctx.lineWidth = pen[1]; ctx.lineJoin = "miter"; ctx.stroke(); }
}
function polygon(ctx, pts, fill, pen) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (pen) { ctx.strokeStyle = pen[0]; ctx.lineWidth = pen[1]; ctx.lineJoin = "miter"; ctx.stroke(); }
}
const slantDx = (h, u) => Math.min(h * 0.3, 10 * u);
function slant(x, y, w, h, u, dx = null) {   // a parallelogram leaning right inside the rect
  dx = dx == null ? slantDx(h, u) : dx;
  return [[x + dx, y], [x + w, y], [x + w - dx, y + h], [x, y + h]];
}
const minimalLine = (a, opacity) => rgba(LINE_RGB, int(255 * opacity * a) / 255);

// The box behind a part in the later designs (hud/overlay.py paint_frame)
function paintFrame(ctx, x, y, w, h, kind, u, a, opacity, accent = null) {
  if (kind == null || kind === "none") return;
  const fill = rgba(BAND_RGB, opacity * a);
  if (kind === "square") ctx.fillStyle = fill, ctx.fillRect(x, y, w, h);
  else if (kind === "rounded") roundRect(ctx, x, y, w, h, 6 * u, fill);
  else if (kind === "frame") {
    const c = accent || WHITE;
    const ix = x + u, iy = y + u, iw = w - 2 * u, ih = h - 2 * u;
    roundRect(ctx, ix, iy, iw, ih, Math.min(5 * u, ih / 2), fill, [rgba(c, int(255 * a) / 255), 2 * u]);
  } else if (kind === "slash") {
    polygon(ctx, slant(x, y, w, h, u), fill);
    if (accent) {   // a player-color edge on the slanted left side
      const dx = slantDx(h, u);
      polygon(ctx, slant(x, y, dx + 4 * u, h, u, dx), rgba(accent, int(255 * a) / 255));
    }
  }
}

// The dark band behind a part (hud/overlay.py Band.paintEvent)
function paintBand(ctx, part) {
  const alpha = int(255 * part.opacity * (part.dim ? 0.4 : 1));
  if (alpha <= 0) return;
  const W = part.w, H = part.h, solid = rgba(BAND_RGB, alpha / 255);
  if (part.square) { ctx.fillStyle = solid; ctx.fillRect(0, 0, W, H); }
  else if (part.fade) {
    const clear = rgba(BAND_RGB, 0);
    const g = ctx.createLinearGradient(0, 0, W - 1, 0);
    const ends = part.fade === "left" ? [clear, solid] : [solid, clear];
    g.addColorStop(0, ends[0]);
    g.addColorStop(part.fade === "left" ? 0.55 : 0.45, solid);
    g.addColorStop(1, ends[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else roundRect(ctx, 0, 0, W, H, 4, solid);
}

// --- labels and values ---
let LABELS = { ...DEFAULT_LABELS };
function setLabels(own, language) { LABELS = { ...(language === "en" ? DEFAULT_LABELS_EN : DEFAULT_LABELS), ...(own || {}) }; }
const labelFor = (key) => LABELS[key] || key.toUpperCase();
function valueSlotWidth(key, px, weight) {
  let d = "0", best = -1;
  for (const c of "0123456789") { const w = textWidth(px, weight, c); if (w > best) { best = w; d = c; } }
  return textWidth(px, weight, VALUE_TEMPLATES[key].replace(/D/g, d));
}
function fmtValue(key, v) {
  if (v == null) return "--";
  if (key === "b2b") return v ? `x${v}` : "--";      // no chain going
  if (key === "attack" || key === "pieces" || key === "ren") return String(int(v));
  return Number(v).toFixed(key === "apm" ? 1 : 2);
}
const fmtClock = (s) => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const isPuyo = (side) => !!(side && (side.puyo || side.hidden));
function sideValues(side) {
  side = side || {};
  return { apm: (side.apm || {}).apm, pps: side.pps, app: side.app, attack: side.attack,
           pieces: side.pieces, ren: side.ren, b2b: side.b2b };
}
const hexCells = (n) => Array.from({ length: n }, (_, i) => [i % 2, Math.floor(i / 2) + (i % 2 ? 0.5 : 0)]);
const gaugeFrac = (key, v) => v == null ? 0 : clamp01(v / GAUGE_MAX[key]);

// ======================================================================
// The parts (hud/overlay.py StatBlock, VersusBlock, EventBlock, ClockBlock,
// SummaryBlock, OpenerBadge). Each has a size (w, h), a spot (x, y) and
// paint(ctx) in its own coordinates.
// ======================================================================
function newPart(extra) {
  return { x: 0, y: 0, w: 0, h: 0, visible: false, opacity: 0.85, dim: false, fade: null, square: false,
           colors: null, u: 1, ...extra };
}

// --- StatBlock ---
const STAT_WIDTH = { band: 92, pop: 104, gauge: 104, text: 104, simple: 92 };
const GAUGE_TEXT_W = 86;
const STAT_ROW_H = { band: 21, pop: 26, gauge: 27, text: 23, simple: 21 };
const STAT_PAD = { band: 3, pop: 1, gauge: 3, text: 1, simple: 3 };
const TABLE = { frame: [21, 9, 4, 12, 17], minimal: [22, 3, 2, 12, 17], trend: [20, 6, 4, 11, 14], slash: [22, 9, 2, 11, 15] };
const STAT_GAP = 6, SPARK_W = 32, SPARK_GAP = 4, STEP = 6, HEX_W = 54, METER_W = 70, METER_H = 48;
const TOWER_BAR_H = 58, TOWER_COL_W = 22, TOWER_GAP = 2, TOWER_PAD = 4;

function makeStat(side) {
  const s = newPart({ side, style: "band", mode: "left", shown: ["apm", "pps", "app"], values: sideValues(null),
                      history: {}, historyT: null });
  s.resetHistory = () => { s.history = Object.fromEntries(STAT_KEYS.map((k) => [k, []])); s.historyT = null; };
  s.resetHistory();
  return s;
}
function statTableCols(s, u, labPx, valPx, keys) {
  keys = keys || (s.shown.length ? s.shown : ["apm"]);
  const labW = Math.max(...keys.map((k) => textWidth(labPx * u, BOLD, labelFor(k))));
  const slotW = Math.max(...keys.map((k) => Math.max(valueSlotWidth(k, valPx * u, SEMI),
                                                     textWidth(valPx * u, SEMI, fmtValue(k, s.values[k])))));
  return [labW, slotW];
}
function statHexW(s, u) {

    ctx.globalAlpha = opacity;
    if (cat.mirrored) { ctx.translate(x * s + w, top * s); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, w, h); }
    else ctx.drawImage(im, x * s, top * s, w, h);
    ctx.restore();
  }
  for (const b of ch.bursts) dopaPaint(ctx, b, s, now);   // ドーパミンモード
}
// a comment's text drawn once (outline and all) and then only moved: strokeText
// for every comment every frame made OBS stutter when many were out (user)
// as challenge.py comment_image (the HUD's look — user): Yu Gothic UI bold for
// every letter, the edge 200/255 black, the picture the text's own outline + 4
// reference px each way, its top-left where the lane says
const COMMENT_FONT_CSS = '"Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif';
function commentImage(c, s, dpr) {
  const px = (c.big ? 50 : 34) * s, key = px * dpr;
  if (c.img && c.imgKey === key) return c.img;
  const k = s * dpr, pad = 4 * k, font = `bold ${px * dpr}px ${COMMENT_FONT_CSS}`;
  const cv = document.createElement("canvas"), x = cv.getContext("2d");
  x.font = font; x.textAlign = "left"; x.textBaseline = "alphabetic";
  const m = x.measureText(c.text);
  const left = m.actualBoundingBoxLeft || 0, asc = m.actualBoundingBoxAscent || px * dpr * 0.8;
  const w = Math.max(1, left + (m.actualBoundingBoxRight || m.width)), h = Math.max(1, asc + (m.actualBoundingBoxDescent || 0));
  cv.width = Math.ceil(w + pad * 2); cv.height = Math.ceil(h + pad * 2);
  x.font = font; x.textAlign = "left"; x.textBaseline = "alphabetic"; x.lineJoin = "round"; x.lineCap = "round";
  x.lineWidth = 3.5 * k; x.strokeStyle = "rgba(0,0,0,0.784)"; x.strokeText(c.text, pad + left, pad + asc);
  x.fillStyle = "#fff"; x.fillText(c.text, pad + left, pad + asc);
  c.img = cv; c.imgKey = key;
  return cv;
}
function challengePaintComments(cw, chh, dpr, now) {
  const ch = challenge, s = scale;
  const comments = Object.values(ch.comments).filter((c) => now - c.born >= 0 && now - c.born < CH_COMMENT_FLOW_S);
  // the comments: on their own canvas, over the parts (as challenge.py CommentView)
  if (cmCanvas.width !== cw || cmCanvas.height !== chh) {
    cmCanvas.width = cw; cmCanvas.height = chh;
    cmCanvas.style.width = window.innerWidth + "px"; cmCanvas.style.height = window.innerHeight + "px";
  }
  const cctx = cmCtx;
  if (!comments.length && !ch.commentsDrawn) return;   // (nothing out, and the canvas already clear)
  cctx.setTransform(1, 0, 0, 1, 0, 0);
  cctx.clearRect(0, 0, cw, chh);
  cctx.imageSmoothingEnabled = false;
  for (const c of comments) {   // right to left, in device pixels
    const img = commentImage(c, s, dpr), w = img.width / dpr;
    const x = 1232 * s - (now - c.born) / CH_COMMENT_FLOW_S * (1232 * s + w), y = (30 + c.lane * 58) * s;
    cctx.drawImage(img, Math.round(x * dpr), Math.round(y * dpr));
  }
  ch.commentsDrawn = comments.length > 0;
}

// ======================================================================
// State from the server
// ======================================================================
function render(state) {
  if (state.display) display = { ...DEFAULTS, ...state.display };
  lastState = state = markHiddenSides(state, display.players);
  stateT = performance.now();
  const ui = UI_TEXT[display.language === "en" ? "en" : "ja"];
  clock.clockText = fmtClock(state.match_elapsed_s);
  clock.stateText = state.frozen ? ui.frozen : state.paused ? ui.paused : state.waiting_start ? ui.waiting : "";
  const cap = state.capture || {}, stale = cap.ok === false;
  const msg = (display.language === "en" && cap.message_en) || cap.message;
  clock.statusText = stale ? `⚠ ${msg || ui.capture_down}`
    : !connected ? (everConnected ? ui.disconnected : ui.connecting) : "";
  for (const side of ["left", "right"]) statUpdate(stats[side], state[side], state.match_elapsed_s);
  versus.values = { left: sideValues(state.left), right: sideValues(state.right) };
  versus.puyo = { left: isPuyo(state.left), right: isPuyo(state.right) };
  summary.duration = state.match_elapsed_s || 0;
  summary.sides = { left: summarySide(state.left), right: summarySide(state.right) };
  summaryResize(summary);   // long opener names: more lines, a taller box
  // dim rather than hide when capture is down: the numbers are the last real measurement
  for (const p of [stats.left, stats.right, events.left, events.right, versus, clock, session, summary, ...Object.values(badges)]) p.dim = stale;
  layout();
  challengeUpdate();
}

let lastMessage = null;
function connect() {
  const ws = new WebSocket("ws://127.0.0.1:8765");
  ws.onopen = () => { connected = everConnected = true; lastMessage = null; render(lastState); };
  ws.onclose = () => { connected = false; render(lastState); setTimeout(connect, 2000); };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (event) => {
    if (event.data === lastMessage) return;   // nothing changed (menus, the result screen): nothing to redraw
    lastMessage = event.data;
    const state = JSON.parse(event.data);
    // OBS keeps a page as it first loaded it: when the app's files change
    // (an update, a new cat) the server says so and the page loads them again
    if (state.page_rev) {
      if (pageRev === null) pageRev = state.page_rev;
      else if (state.page_rev !== pageRev) { location.reload(); return; }
    }
    render(state);
  };
}
window.addEventListener("resize", () => { layout(); challengePaint(); });
document.fonts && document.fonts.ready.then(() => { widthCache.clear(); layout(); });
render({});
connect();
</script>
</body>
